# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Daniel's notes
email:
future: false
description: >- # this means to ignore newlines until "baseurl:"
  Blog about WEBCON BPS and GitHub projects.
#twitter_username: username
github_username: daniel-krueger
minimal_mistakes_skin: contrast
search: true
locale: en
search_provider: google
# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.0
# Outputting
permalink: /:categories/:title/
paginate: 10 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
enable_copy_code_button: true

comments:
  provider: "disqus"
  disqus:
    shortname: "daniels-notes"

#comments: 
#  provider: "giscus"
#  giscus:
#    repo_id              : # Shown during giscus setup at https://giscus.app
#    category_name        : # Full text name of the category
#    category_id          : # Shown during giscus setup at https://giscus.app
#    discussion_term      : # "pathname" (default), "url", "title", "og:title"
#    reactions_enabled    : # '1' for enabled (default), '0' for disabled
#    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"

google:
  search_engine_id: 35d70d18d9a775990

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
   - Gemfile
   - Gemfile.lock
   - node_modules
   - vendor/bundle/
   - vendor/cache/
   - vendor/gems/
   - vendor/ruby/
   - .git

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Daniel Krüger"  
  avatar : "/assets/images/bio_pixelate.png" 
  bio: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Daniel-Krueger"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/Krueger-Daniel"      
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@D.Krueger/playlists"  
    - label: "I 💗 WEBCON BPS series"
      icon: "fab fa-fw fa-webcon"
      url: "/posts/2023/i-love-webcon-bps-overview#series"
     

footer:
  links:
    #- label: "Twitter"
    #  icon: "fab fa-fw fa-twitter-square"
    #  url: "https://twitter.com/"
    #- label: "GitHub"
    #  icon: "fab fa-fw fa-github"
    #  url: "https://github.com/"
    #- label: "Instagram"
    #  icon: "fab fa-fw fa-instagram"
    #  url: "https://instagram.com/"

defaults:
# default 
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      comments: true
      sidebar:
        nav: "docs"
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
      permalink: /posts/:year/:slug
      sidebar:
        nav: "docs"
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      show_date: true
      author_profile: true
      sidebar:
        nav: "docs"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
